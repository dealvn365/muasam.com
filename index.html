<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Landing Video</title>

<style>
body{margin:0;background:#000;font-family:sans-serif;}

.video{
  position:relative;
  width:100%;
  height:100vh;
}

/* video */
.video iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:0;
}

/* lớp click */
.click-layer{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:5;
}

/* nút */
.overlay{
  position:absolute;
  bottom:30px;
  width:100%;
  text-align:center;
  z-index:10;
}

.btn{
  background:red;
  color:white;
  padding:15px 30px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="video">

  <!-- VIDEO -->
  <iframe
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0"
    allow="autoplay"
    allowfullscreen>
  </iframe>

  <!-- CLICK 1 LẦN -->
  <a id="clickLayer" href="#" class="click-layer"></a>

  <!-- NÚT -->
  <div class="overlay">
    <a href="https://shopee.vn" target="_blank" class="btn">
      🔥 MUA NGAY
    </a>
  </div>

</div>

<script>
const SHOPEE_LINK = "https://shopee.vn";

// kiểm tra đã click chưa
let clicked = localStorage.getItem("clicked_once");

// nếu chưa click → bật lớp click
if(!clicked){
  let layer = document.getElementById("clickLayer");

  layer.addEventListener("click", function(e){
    e.preventDefault();

    // lưu trạng thái đã click
    localStorage.setItem("clicked_once", "true");

    // mở link
    window.location.href = SHOPEE_LINK;
  });

}else{
  // đã click rồi → tắt lớp click
  document.getElementById("clickLayer").style.display = "none";
}
</script>

</body>
</html>
