<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Landing Video</title>

<style>
body{margin:0;background:#000;font-family:sans-serif;}

.video{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* iframe */
.video iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:0;
  pointer-events:none; /* chặn click YouTube */
}

/* overlay */
.overlay{
  position:absolute;
  bottom:30px;
  width:100%;
  text-align:center;
}

/* nút */
.btn{
  display:inline-block;
  margin:10px;
  padding:15px 25px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  font-size:16px;
}

.buy{
  background:red;
  color:white;
}

.sound{
  background:#222;
  color:white;
}

/* hiệu ứng */
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

.buy{
  animation:pulse 1.5s infinite;
}
</style>
</head>

<body>

<div class="video">

  <!-- VIDEO -->
  <iframe id="videoFrame"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0"
    allow="autoplay"
    allowfullscreen>
  </iframe>

  <!-- BUTTON -->
  <div class="overlay">
    <a href="https://shopee.vn" class="btn buy" target="_blank">
      🔥 MUA NGAY
    </a>

    <button class="btn sound" onclick="unmuteVideo()">
      🔊 Bật tiếng
    </button>
  </div>

</div>

<script>
// 👉 bật tiếng
function unmuteVideo(){
  let iframe = document.getElementById("videoFrame");
  iframe.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=1";
}

// 👉 auto redirect random 12–30s
window.onload = function(){
  let delay = Math.floor(Math.random() * (30000 - 12000 + 1)) + 12000;
  console.log("Redirect sau:", delay);

  let start = Date.now();
  let timer = setInterval(function(){
    if(Date.now() - start >= delay){
      window.location.href = "https://shopee.vn";
      clearInterval(timer);
    }
  }, 500);
};
</script>

</body>
</html>
