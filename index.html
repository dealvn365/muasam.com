<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Landing Pro</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:sans-serif;
  color:white;
}

/* VIDEO NỀN */
.bg iframe{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  border:0;
  z-index:1;
  pointer-events:none;
}

/* NÚT BẬT TIẾNG */
.sound-btn{
  position:fixed;
  top:20px;
  right:20px;
  z-index:20;
  padding:10px 15px;
  border-radius:20px;
  border:none;
  background:#222;
  color:white;
  cursor:pointer;
  display:none;
}

/* POPUP */
.popup{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.box{
  background:#111;
  padding:25px;
  border-radius:15px;
  text-align:center;
  max-width:320px;
}

.btn{
  display:inline-block;
  margin-top:15px;
  padding:12px 25px;
  background:red;
  color:white;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
}

/* CARD */
.card{
  position:fixed;
  bottom:20px;
  right:20px;
  width:280px;
  background:#111;
  border-radius:15px;
  overflow:hidden;
  display:none;
  z-index:9;
}

.card iframe{
  width:100%;
  height:160px;
  border:0;
}

.card p{
  padding:10px;
}
</style>

</head>

<body>

<!-- VIDEO -->
<div class="bg">
  <iframe id="bgVideo"
  src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0">
  </iframe>
</div>

<!-- NÚT BẬT TIẾNG -->
<button class="sound-btn" id="soundBtn" onclick="batTieng()">
  🔊 Bật tiếng
</button>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="box">
    <p>🙏 Nhấn Shopee để ủng hộ shop (không cần mua)</p>
    <button class="btn" onclick="clickShopee()">Đi Shopee</button>
  </div>
</div>

<!-- CARD -->
<div class="card" id="card">
  <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1"></iframe>
  <p>🎬 Video hấp dẫn</p>
</div>

<script>

// nếu đã click rồi
if(localStorage.getItem("clicked")){
  document.getElementById("popup").style.display="none";
  showCard();
}

// click Shopee
function clickShopee(){
  localStorage.setItem("clicked","true");

  window.open("https://shopee.vn","_blank");

  document.getElementById("popup").style.display="none";

  setTimeout(showCard,10000);
}

// hiện card
function showCard(){
  document.getElementById("card").style.display="block";
}

// bật tiếng
function batTieng(){
  let iframe = document.getElementById("bgVideo");
  iframe.src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=1";
  document.getElementById("soundBtn").style.display="none";
}

// hiện nút bật tiếng sau 3s
setTimeout(()=>{
  document.getElementById("soundBtn").style.display="block";
},3000);

</script>

</body>
</html>
