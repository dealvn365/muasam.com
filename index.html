<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Landing Video</title>

<style>
body{margin:0;background:#000;font-family:sans-serif;}
.video{position:relative;width:100%;height:100vh;}
.video iframe{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  border:0;
  pointer-events:none;
}
.overlay{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
}
.btn{
  background:red;
  color:white;
  padding:15px 30px;
  border-radius:30px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="video">
  <iframe 
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0"
    allow="autoplay"
    allowfullscreen>
  </iframe>

  <div class="overlay">
    <a href="https://shopee.vn" class="btn">MUA NGAY</a>
  </div>
</div>

<script>
// Random 12–30 giây
let delay = Math.floor(Math.random() * (30000 - 12000 + 1)) + 12000;

// Link Shopee
let link = "https://shopee.vn";

// Redirect
setTimeout(function(){
    window.location.href = link;
}, delay);
</script>

</body>
</html>
