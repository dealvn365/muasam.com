<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Landing Force</title>

<style>
body{
  margin:0;
  background:radial-gradient(circle,#111,#000);
  font-family:sans-serif;
  color:white;
  overflow:hidden;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.box{
  background:#111;
  padding:30px;
  border-radius:20px;
  text-align:center;
  width:320px;
  box-shadow:0 0 40px rgba(0,0,0,0.8);
}

.btn{
  margin-top:15px;
  padding:12px 25px;
  background:red;
  color:white;
  border:none;
  border-radius:30px;
  cursor:pointer;
  font-weight:bold;
}

/* CARD VIDEO */
.card{
  position:fixed;
  top:5%;
  left:5%;
  width:90%;
  height:90%;
  background:#000;
  border-radius:20px;
  overflow:hidden;
  display:none;
  z-index:20;
  box-shadow:0 0 50px rgba(0,0,0,0.9);
  animation:fadeIn .4s ease;
}

.card iframe{
  width:100%;
  height:100%;
  border:0;
}

/* CLOSE */
.close{
  position:absolute;
  top:10px;
  right:15px;
  z-index:30;
  background:red;
  border:none;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
  font-size:18px;
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(.9);}
  to{opacity:1; transform:scale(1);}
}
</style>

</head>

<body>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="box">
    <p>🙏 Nhấn vào Shopee để tiếp tục<br>(không cần mua)</p>
    <button class="btn" onclick="goShopee()">Tiếp tục</button>
  </div>
</div>

<!-- VIDEO -->
<div class="card" id="card">

  <button class="close" onclick="closeCard()">✖</button>

  <iframe 
  src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1"
  allow="autoplay"
  allowfullscreen>
  </iframe>

</div>

<script>

// luôn hiện popup (không lưu gì)

// click Shopee
function goShopee(){

  // mở Shopee
  window.open("https://shopee.vn","_blank");

  // ẩn popup
  document.getElementById("popup").style.display="none";

  // 5s sau mới cho xem video
  setTimeout(()=>{
    document.getElementById("card").style.display="block";
  },5000);
}

// đóng video
function closeCard(){
  document.getElementById("card").style.display="none";
}

</script>

</body>
</html>
