<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Landing Manual Play</title>

<style>
body{
  margin:0;
  background:radial-gradient(circle,#111,#000);
  font-family:sans-serif;
  color:white;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.box{
  background:#111;
  padding:30px;
  border-radius:20px;
  text-align:center;
  width:320px;
}

/* BUTTON */
.btn{
  margin-top:15px;
  padding:12px 25px;
  background:red;
  color:white;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

/* CARD */
.card{
  position:fixed;
  top:5%;
  left:5%;
  width:90%;
  height:90%;
  background:#000;
  border-radius:20px;
  display:none;
  z-index:20;
  overflow:hidden;
}

/* VIDEO WRAP */
.video-wrap{
  position:relative;
  width:100%;
  height:100%;
}

/* iframe */
.video-wrap iframe{
  width:100%;
  height:100%;
  border:0;
}

/* NÚT PLAY */
.play-btn{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:24px;
  padding:15px 30px;
  background:red;
  border:none;
  border-radius:30px;
  color:white;
  cursor:pointer;
  z-index:5;
}

/* CLOSE */
.close{
  position:absolute;
  top:10px;
  right:15px;
  z-index:30;
  background:red;
  border:none;
  color:white;
  width:35px;
  height:35px;
  border-radius:50%;
  cursor:pointer;
}
</style>

</head>

<body>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="box">
    <p>🙏 Nhấn Shopee để tiếp tục</p>
    <button class="btn" onclick="goShopee()">Tiếp tục</button>
  </div>
</div>

<!-- CARD -->
<div class="card" id="card">

  <button class="close" onclick="closeCard()">✖</button>

  <div class="video-wrap">

    <!-- NÚT PLAY -->
    <button class="play-btn" onclick="playVideo()">▶ Xem video</button>

    <!-- VIDEO -->
    <iframe id="videoFrame"></iframe>

  </div>

</div>

<script>

// click Shopee
function goShopee(){
  window.open("https://shopee.vn","_blank");

  document.getElementById("popup").style.display="none";

  // 5s sau mới hiện video
  setTimeout(()=>{
    document.getElementById("card").style.display="block";
  },5000);
}

// play video có tiếng
function playVideo(){
  document.getElementById("videoFrame").src =
  "https://www.youtube.com/embed/g9cQTE4t5cI?si=2DKEsTwAl5CmCnIW=1";
  // ẩn nút play
  document.querySelector(".play-btn").style.display="none";
}

// đóng
function closeCard(){
  document.getElementById("card").style.display="none";
}

</script>

</body>
</html>
