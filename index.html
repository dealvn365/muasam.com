<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Landing Video</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:sans-serif;
}

/* Video full màn hình */
.video{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

.video iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:0;
  pointer-events:none; /* ❗ chặn click vào YouTube */
}

/* Overlay */
.overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  background:linear-gradient(to top, rgba(0,0,0,0.6), transparent);
  padding:20px;
}

/* Nút mua */
.btn{
  background:linear-gradient(90deg,#ff6b6b,#ff3d3d);
  color:white;
  padding:15px 30px;
  border-radius:30px;
  font-size:18px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 5px 20px rgba(255,0,0,0.4);
  animation:pulse 1.5s infinite;
}

/* Hiệu ứng nhấp nháy */
@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

/* Text */
.text{
  color:white;
  margin-bottom:15px;
  font-size:18px;
  text-align:center;
}
</style>

</head>
<body>

<div class="video">

  <!-- VIDEO -->
  <iframe 
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0"
    allow="autoplay"
    allowfullscreen>
  </iframe>

  <!-- LAYER -->
  <div class="overlay">
    <div class="text">🔥 Ưu đãi hôm nay – Số lượng có hạn</div>
    
    <a href="https://shopee.vn" class="btn" target="_blank">
      MUA NGAY
    </a>
  </div>

</div>

</body>
</html>
